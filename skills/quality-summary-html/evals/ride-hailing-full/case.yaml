schema_version: "1.1"
name: ride-hailing-full
expected_outcome: |
  docs/quality/summary.html is built from the outputs of a replay of the demo with cuj-to-slo 0.3.0. The page starts with the traceability table by CUJ (CUJ, QIU, FR, QR, NFR / SLI), grouped by user, with one row for each of the 32 QIUs that are not retired. The tables of stages 1 to 4 are each in a closed toggle, and IDs in the tables link to their rows. The product quality matrix has a column for QRs that come from an entry point. Target statuses use the glossary's terms (確認済み, 仮), the data producers include EXT-01 and EXT-02, and no column of the SLI table is empty for every SLI. The final report reports no coverage disagreement for the QIUs that the stage 2 report covers in several rows (QIU-21, 22, 24, 25, 26, 31 and 32), and finds every report table, the stage 4 allocation table headed 「配分」 included.
context:
