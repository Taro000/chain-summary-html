id: DEC-03
title: 記録を書いてから受領を示す
status: active
basis: inferred
basis_note: FND-01 を受けて、受領を先に示す案から改めた
premises: []
stage: architecture
question: 受領の表示を、提出の記録とどう一致させるか
addresses:
- DRV-03
- DRV-09
options:
- name: 一つのトランザクションで記録を書き、受領を返す
  effect: 受領と記録が食い違わない
  cost: 確定が少し遅くなる
- name: 受領を先に返し、記録は後で書く
  effect: 確定が速い
  cost: 記録が欠けても受領が出る
chosen: 一つのトランザクションで記録を書き、受領を返す
rationale: 原則 DRV-09 に従う（FND-01 を受けて改めた）。受領を先に示すと、記録が欠けても受領が出る。
rejected:
- option: 受領を先に返し、記録は後で書く
  reason: 記録が欠けうる（DRV-03）
gains:
- 受領が出たら必ず記録がある
costs:
- 確定に書き込みの時間が乗る（DRV-02）
sensitive_points:
- 記録の書き込みの時間
trade_offs:
- with: DRV-02
  note: 書き込みの分だけ確定が遅くなる
assumptions: []
depends_on:
- DEC-01
parameters: []
debt: null
as_is: new
