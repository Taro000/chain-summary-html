schema_version: "1.1"
name: homework-service-full
expected_outcome: |
  docs/design/summary.html is built from the YAML items written by req-to-design 0.3.0 (stages 1, 2, 2b and 3). The page
  starts with the ranking table of the architecture drivers, open, in the YAML's rank order, without the principle
  DRV-09 and the retired DRV-10. Every other table is in a closed toggle, and IDs link to their rows. Each stage 2
  decision has an entry with its question, its options and the rejected options' reasons from dec/*.yaml. The debt table
  shows DEC-06's debt, although the stage 2 report's debt table leaves it out; the final report tells the user so.
  Stage 2b shows the six technical policies and the decisions DEC-07 and DEC-08; the open hand-offs HND-02, HND-04 and
  HND-03 are shown, the decided HND-01 is not. The CUJ walkthroughs, labelled with lines that end in a colon, are on the
  page. Every text shows only its gist, its first sentence without bracketed asides (DEC-02's rationale stops before
  「署名付き URL なら」). No finding numbers reach the page. The reports' diagrams are drawn, the flow numbers on the threat
  diagram link to the threat table (F5 shares a row with F4), NFR-06's hop budgets are a chart against 3 seconds although
  the report names the rows 「余裕」 and 「計」, and the header shows 2026-09-25.
